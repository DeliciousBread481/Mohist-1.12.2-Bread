name: Build Mohist  
  
on:  
  push:  
    branches: [ "1.20.1" ]  
  pull_request:  
    branches: [ "1.20.1" ]  
  workflow_dispatch:  
  
jobs:  
  build:  
    runs-on: ubuntu-latest  
    permissions:  
      contents: read  
  
    steps:  
      - name: Checkout repository  
        uses: actions/checkout@v4  
        with:  
          fetch-depth: 0 
  
      - name: Set up JDK 17  
        uses: actions/setup-java@v4  
        with:  
          java-version: '17'  
          distribution: 'temurin'  
  
      - name: Setup Gradle  
        uses: gradle/actions/setup-gradle@v4  
        with:  
          gradle-version: '8.7'  
  
      - name: Make gradlew executable  
        run: chmod +x ./gradlew  
  
      - name: Run setup  
        run: ./gradlew setup --stacktrace  
  
      - name: Package libraries  
        run: ./gradlew packageLibraries --stacktrace  
  
      - name: Build Mohist server jar  
        run: ./gradlew mohistJar --stacktrace  
  
      - name: Upload server jar  
        uses: actions/upload-artifact@v4  
        with:  
          name: Mohist-1.20.1-server  
          path: projects/mohist/build/libs/*-server.jar  
          if-no-files-found: error